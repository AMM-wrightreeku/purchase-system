<!DOCTYPE html>
<html lang="zh-Hant-TW">
    <head>
        <meta charset="UTF-8">
        <title>進貨登錄系統</title>

        <link rel="stylesheet" href="/css/common.css">
        <link rel="stylesheet" href="/css/index.css">
    </head>

    <body>
        <div id="navbar"></div>

        <main>
            <section class="input-panel">
                <h1>進貨登錄系統</h1>
                <div class="section">
                    <h2>進貨基本資料</h2>
                    <div class="form-row">
                        <label for="supplierId">供應商</label>
                        <select id="supplierId">
                            <option value="">請選擇供應商</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label for="purchaseDate">日期</label>
                        <input type="date" id="purchaseDate">
                    </div>
                    <div class="form-row">
                        <label for="note">備註</label>
                        <input type="text" id="note">
                    </div>
                </div>
                <div class="section">
                    <h2>加入商品</h2>
                    <div class="form-row">
                        <label for="barcode">條碼</label>
                        <input type="text" id="barcode">
                    </div>
                    <div class="form-row">
                        <label for="productName">商品名稱</label>
                        <input type="text" id="productName">
                    </div>
                    <div class="form-row">
                        <label for="quantity">數量</label>
                        <input type="number" id="quantity">
                    </div>
                    <div class="form-row">
                        <label for="totalPrice">進貨價格</label>
                        <input type="number" id="totalPrice">
                    </div>
                    <button id="addItemButton" class="align-right">加入清單</button>
                </div>
            </section>
            
            <section class="result-panel">
                <div class="section">
                    <h2>目前商品清單</h2>
                    <div id="itemList">尚未加入商品</div>
                    <br>
                    <button id="previewButton" class="align-right">確認進貨內容</button>
                </div>
                <!-- <div class="section">
                    <h2>最終確認</h2>
                    <div id="previewArea">尚未產生確認內容</div>
                </div> -->
            </section>
            <dialog id="confirmDialog">
                <h1>最終確認進貨內容</h1>
                <div id="previewArea">尚未產生確認內容</div>
            </dialog>
        </main>

        <script src="/js/common.js"></script>
        <script src="/js/index.js"></script>
    </body>
</html>
