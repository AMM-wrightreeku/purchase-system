<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>廠商管理</title>
    </head>
    <body>
        <nav>
            <a href="/index.html">進貨登錄</a>
            <a href="/purchase-search.html">進貨查詢</a>
            <a href="/product.html">商品管理</a>
            <a href="/supplier.html">廠商管理</a>
        </nav>

        <h2>廠商管理</h2>
        <div class="create-supplier">
            <h3>新增廠商</h3>
            <div class="form-row">
                <label for="name">廠商名稱</label>
                <input type="text" id="name">
            </div>
            <button id="createButton">新增</button>
        </div>
        <div id="supplierList">
            <h3>廠商列表</h3>
        </div>

        <script>
            function loadSuppliers() {
                fetch("/suppliers")
                .then(response => response.json())
                .then(suppliers => {
                    const supplierList = document.getElementById("supplierList");
                    supplierList.innerHTML = "<h3>廠商列表</h3>";

                    suppliers.forEach(supplier => {
                        supplierList.innerHTML += `
                            <div class="supplier">
                                <p>
                                    ID：${supplier.id}<br>
                                    廠商：${supplier.name}
                                </p>
                            </div>`;
                    })
                })
            }
            loadSuppliers();

            document.getElementById('createButton').addEventListener("click", function() {
                const name = document.getElementById("name").value;
                const request = {
                    name: name
                };
                
                fetch("/suppliers", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(request)
                })
                .then(response => {
                    if(!response.ok) {
                        throw new Error("新增廠商失敗");
                    }
                    return response.json();
                })
                .then(() => {
                    document.getElementById("name").value = "";
                    loadSuppliers();
                })
                .catch(error => {
                    alert("新增廠商失敗");
                    console.log(error);
                })
            })
        </script>

    </body>

</html>
