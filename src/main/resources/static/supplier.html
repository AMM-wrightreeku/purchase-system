<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>廠商管理</title>

        <style>
            html {
                scrollbar-gutter: stable;
            }
            body {
                background-color: #f5f5f5;
                max-width: 1300px;
                margin: 0 auto;
                font-family: Arial, "Microsoft JhengHei", sans-serif;
                line-height: 0.8;
            }
            /* top */
            .top-bar {
                padding: 15px 20px;
                border-bottom: 1px solid #ccc;
                background-color: #c1dddf;
            }
            .top-bar nav {
                display: flex;
                gap: 15px;
                align-items: center;
            }
            .shutdown-button {
                margin-left: auto;
            }
            .link-button {
                display: inline-block;
                padding: 8px 16px;
                border: 1px solid #888;
                border-radius: 4px;
                background-color: #f0f0f0;
                color: #000;
                text-decoration: none;
                line-height: normal;
            }
            /* floor */
            main {
                display: flex;
                gap: 20px;
                margin: 10px;
            }
            .input-panel,
            .result-panel {
                flex: 1;
                min-width: 0;
                border: 1px solid #ccc;
                padding: 10px;
                border-radius: 4px;
                background-color: #fff;
            }
            /* left */
            .input-panel h1 {
                margin-top: 0;
            }
            .form-row {
                display: flex;
                align-items: center;
                margin-bottom: 10px;
            }
            .form-row label {
                width: 100px;
                flex-shrink: 0;
            }
            .form-row input,
            .form-row select {
                flex: 1;
                padding: 8px;
                box-sizing: border-box;
            }
            #createButton {
                display: block;
                margin-left: auto;
            }
            .section {
                margin-bottom: 25px;
            }
            /* right */
            h2 {
                margin-top: 0;
                margin-bottom: 15px;
            }
            .supplier {
                background-color: #f7f7f7;
                padding: 1px 10px;
                border-radius: 6px;
                margin-bottom: 1px;
                line-height: 1.0;
            }
            /* all Area */
            button {
                padding: 8px 16px;
                cursor: pointer;
                border-radius: 4px;
            }
            
            @media (max-width: 800px) {
                main {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <header class="top-bar">
             <nav> 
                <a class="link-button" href="/index.html">進貨登錄</a>
                <a class="link-button" href="/purchase-search.html">進貨查詢</a>
                <a class="link-button" href="/product.html">商品管理</a>
                <a class="link-button" href="/supplier.html">廠商管理</a>
                <button class="shutdown-button" type="button" onclick="shutdownSystem()">關閉系統</button>
            </nav>
        </header>
        <main>
            <section class="input-panel">
                <h1>廠商管理</h1>
                <div class="section">
                    <h2>新增廠商</h2>
                    <div class="form-row">
                        <label for="name">廠商名稱</label>
                        <input type="text" id="name">
                    </div>
                    <button id="createButton">新增</button>
                </div>
            </section>
            <section class="result-panel">
                <div class="section">
                    <div id="supplierList">
                        <h2>廠商列表</h2>
                    </div>
                </div>
            </section>
        </main>
        <script src="/js/common.js"></script>
        <script>
            function loadSuppliers() {
                fetch("/suppliers")
                .then(response => response.json())
                .then(suppliers => {
                    const supplierList = document.getElementById("supplierList");
                    supplierList.innerHTML = "<h2>廠商列表</h2>";

                    suppliers.forEach(supplier => {
                        supplierList.innerHTML += `
                            <div class="supplier">
                                <p>
                                    ID：${supplier.id}<br>
                                    廠商：${supplier.name}
                                </p>
                            </div>`;
                    })
                })
            }
            loadSuppliers();

            document.getElementById('createButton').addEventListener("click", function() {
                const name = document.getElementById("name").value;
                const request = {
                    name: name
                };
                
                fetch("/suppliers", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(request)
                })
                .then(response => {
                    if(!response.ok) {
                        throw new Error("新增廠商失敗");
                    }
                    return response.json();
                })
                .then(() => {
                    document.getElementById("name").value = "";
                    loadSuppliers();
                })
                .catch(error => {
                    alert("新增廠商失敗");
                    console.log(error);
                })
            })
        </script>

    </body>

</html>
