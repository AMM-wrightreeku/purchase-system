<!DOCTYPE html>
<html lang="zh-Hant-TW">
    <head>
        <meta charset="UTF-8">
        <title>廠商管理</title>

        <link rel="stylesheet" href="/css/common.css">
        <link rel="stylesheet" href="/css/supplier.css">
    </head>
    
    <body>
        <div id="navbar"></div>

        <main>
            <section class="input-panel">
                <h1>廠商管理</h1>
                <div class="section">
                    <h2>新增廠商</h2>
                    <div class="form-row">
                        <label for="name">廠商名稱</label>
                        <input type="text" id="name">
                    </div>
                    <button id="createButton" class="align-right">新增</button>
                </div>
            </section>

            <section class="result-panel">
                <div class="section">
                    <div id="supplierList">
                        <h2>廠商列表</h2>
                    </div>
                </div>
            </section>
        </main>

        <script src="/js/common.js"></script>
        <script src="/js/supplier.js"></script>
    </body>
</html>
