<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>廠商管理</title>

        <style>
            body {
                font-family: Arial, "Microsoft JhengHei", sans-serif;
                max-width: 900px;
                margin: 30px auto;
                padding: 0 20px;
                line-height: 1.8;
            }

            nav {
                margin-bottom: 20px;
            }

            nav a {
                margin-right: 15px;
            }

            .create-supplier,
            #supplierList {
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
            }

            .create-supplier h3,
            #supplierList h3 {
                margin-top: 0;
            }

            .form-row {
                margin-bottom: 10px;
            }

            .form-row label {
                display: inline-block;
                width: 90px;
            }

            input {
                padding: 6px;
                min-width: 220px;
            }

            button {
                padding: 8px 16px;
                margin-right: 8px;
                cursor: pointer;
            }

            .supplier {
                background-color: #f7f7f7;
                padding: 10px 15px;
                border-radius: 6px;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="/index.html">進貨登錄</a>
            <a href="/purchase-search.html">進貨查詢</a>
            <a href="/product.html">商品管理</a>
            <a href="/supplier.html">廠商管理</a>
            <button type="button" onclick="shutdownSystem()">關閉系統</button>
        </nav>

        <h1>廠商管理</h1>
        <div class="create-supplier">
            <h3>新增廠商</h3>
            <div class="form-row">
                <label for="name">廠商名稱</label>
                <input type="text" id="name">
            </div>
            <button id="createButton">新增</button>
        </div>
        <div id="supplierList">
            <h3>廠商列表</h3>
        </div>

        <script src="/js/common.js"></script>
        <script>
            function loadSuppliers() {
                fetch("/suppliers")
                .then(response => response.json())
                .then(suppliers => {
                    const supplierList = document.getElementById("supplierList");
                    supplierList.innerHTML = "<h3>廠商列表</h3>";

                    suppliers.forEach(supplier => {
                        supplierList.innerHTML += `
                            <div class="supplier">
                                <p>
                                    ID：${supplier.id}<br>
                                    廠商：${supplier.name}
                                </p>
                            </div>`;
                    })
                })
            }
            loadSuppliers();

            document.getElementById('createButton').addEventListener("click", function() {
                const name = document.getElementById("name").value;
                const request = {
                    name: name
                };
                
                fetch("/suppliers", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(request)
                })
                .then(response => {
                    if(!response.ok) {
                        throw new Error("新增廠商失敗");
                    }
                    return response.json();
                })
                .then(() => {
                    document.getElementById("name").value = "";
                    loadSuppliers();
                })
                .catch(error => {
                    alert("新增廠商失敗");
                    console.log(error);
                })
            })
        </script>

    </body>

</html>
