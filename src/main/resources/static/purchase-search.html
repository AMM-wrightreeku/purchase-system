<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>進貨查詢</title>

        <style>
            body {
                font-family: Arial, "Microsoft JhengHei", sans-serif;
                max-width: 900px;
                margin: 30px auto;
                padding: 0 20px;
                line-height: 1.8;
            }

            nav {
                margin-bottom: 20px;
            }

            nav a {
                margin-right: 15px;
            }

            .search,
            #resultArea,
            #detailArea {
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
            }

            .search h3,
            #resultArea h3,
            #detailArea h3 {
                margin-top: 0;
            }

            .form-row {
                margin-bottom: 10px;
            }

            .form-row label {
                display: inline-block;
                width: 90px;
            }

            input,
            select {
                padding: 6px;
                min-width: 220px;
            }

            button {
                padding: 8px 16px;
                margin-right: 8px;
                cursor: pointer;
            }

            .purchase-result {
                background-color: #f7f7f7;
                padding: 10px 15px;
                border-radius: 6px;
                margin-bottom: 10px;
            }

            #detailArea {
                background-color: #f7f7f7;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="/index.html">進貨登錄</a>
            <a href="/purchase-search.html">進貨查詢</a>
            <a href="/product.html">商品管理</a>
            <a href="/supplier.html">廠商管理</a>
        </nav>
        <h1>進貨查詢</h1>
        <div class="search">
                <div class="form-row">
                    <label for="supplierId">供應商</label>
                    <select id="supplierId">
                        <option value="">全部供應商</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="startDate">開始日期</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-row">
                    <label for="endDate">結束日期</label>
                    <input type="date" id="endDate">
                </div>
                <div class="form-row">
                    <button id="searchButton">
                        搜尋
                    </button>
                </div>
        </div>
        <div id="searchResult">
            <h2>查詢結果</h2>

        </div>
        <div id="purchaseDetail">
        </div>

        <script>
            fetch("/suppliers")
                .then(response => response.json())
                .then(suppliers => {
                    const supplierSelect = document.getElementById("supplierId");
                    suppliers.forEach(supplier => {
                        supplierSelect.innerHTML += `
                        <option value="${supplier.id}">
                            ${supplier.name}
                        </option>`;
                    })
                })

            document.getElementById("searchButton").addEventListener("click", function() {
                const supplierId = document.getElementById("supplierId").value;
                const startDate = document.getElementById("startDate").value;
                const endDate = document.getElementById("endDate").value;

                const parms = new URLSearchParams();
                if(supplierId) {parms.append("supplierId", supplierId);}
                if(startDate) {parms.append("startDate", startDate);}
                if(endDate) {parms.append("endDate", endDate);}

                fetch("/purchases?" + parms.toString())
                    .then(response => {
                        if(!response.ok) {
                            throw new Error("查詢失敗");
                        }
                        return response.json();
                    })
                    .then(purchases => {
                        const resultDiv = document.getElementById("searchResult");
                        resultDiv.innerHTML = "<h2>查詢結果</h2>";

                        if(purchases.length === 0) {
                            resultDiv.innerHTML += "<p>沒有符合條件的進貨紀錄</p>"
                        }

                        purchases.forEach(purchase => {
                            resultDiv.innerHTML += `
                                <div class="purchase-result">
                                    <p>
                                        日期：${purchase.date}<br>
                                        供應商ID：${purchase.supplierId}<br>
                                        備註：${purchase.note ?? ""}
                                    </p>
                                    <button onclick="showPurchaseDetail(${purchase.id})">
                                        查看明細
                                    </button>
                                </div>
                                `;
                        })
                    })
                    .catch(error => {
                        const resultDiv = document.getElementById("searchResult");
                        resultDiv.innerHTML = "<p>查詢失敗</p>";
                        console.error(error);
                    })

            })

            function showPurchaseDetail(purchaseId) {
                fetch("/purchases/" + purchaseId)
                    .then(response => response.json())
                    .then(purchase => {
                        const detailDiv = document.getElementById("purchaseDetail");

                        detailDiv.innerHTML = `
                            <div class="purchase-detail">
                                <h3>進貨明細</h3>
                                <p>
                                    日期：${purchase.date}<br>
                                    供應商：${purchase.supplierName}<br>
                                    備註：${purchase.note ?? ""}
                                </p>
                            </div>`;
                        purchase.items.forEach(item => {
                            detailDiv.innerHTML += `
                                <div class="purchaseItem-result">
                                    <p>
                                        商品名稱：${item.name}<br>
                                        條碼：${item.barcode ?? ""}<br>
                                        數量：${item.quantity}<br>
                                        進價：${item.totalPrice}
                                    </p>
                                </div>`;
                        })
                    })
            }

        </script>
    </body>

</html>
