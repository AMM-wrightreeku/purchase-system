<!DOCTYPE html>
<html lang="zh-Hant-TW">
    <head>
        <meta charset="UTF-8">
        <title>進貨查詢</title>

        <link rel="stylesheet" href="/css/common.css">
        <link rel="stylesheet" href="/css/purchase-search.css">
    </head>

    <body>
        <div id="navbar"></div>

        <main>
            <section class="input-panel">
                <h1>進貨查詢</h1>
                <div class="section">
                    <div class="search">
                        <div class="form-row">
                            <label for="supplierId">供應商</label>
                            <select id="supplierId">
                                <option value="">全部供應商</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label for="startDate">開始日期</label>
                            <input type="date" id="startDate">
                        </div>
                        <div class="form-row">
                            <label for="endDate">結束日期</label>
                            <input type="date" id="endDate">
                        </div>
                        <div class="form-row">
                            <button id="searchButton" class="align-right">
                                搜尋
                            </button>
                        </div>
                    </div>
                </div>
                <div class="section">
                    <div id="purchaseList">
                        <h2>查詢總表</h2>
                    </div>
                </div>
            </section>
            
            <section class="result-panel">
                <div id="searchResult">
                    <h2>查詢結果</h2>
                </div>
            </section>
            <dialog id="purchaseDialog">
                <div id="purchaseDetail"></div>
                <div class="dialog-actions">
                    <button id="deletePurchaseButton" type="button">
                        刪除此進貨單
                    </button>
                    <button id="closeDetailButton" type="button">
                        關閉
                    </button>
                </div>
            </dialog>
        </main>

        <script src="/js/common.js"></script>
        <script src="/js/purchase-search.js"></script>
    </body>
</html>
