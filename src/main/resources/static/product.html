<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8">
        <title>商品管理</title>

        <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.8;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin-right: 15px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .create-product,
        #productList {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .create-product h3,
        #productList h3 {
            margin-top: 0;
        }

        .form-row {
            margin-bottom: 10px;
        }

        .form-row label {
            display: inline-block;
            width: 90px;
        }

        input {
            padding: 6px;
            min-width: 220px;
        }

        button {
            padding: 8px 16px;
            margin-right: 8px;
            cursor: pointer;
        }

        .product {
            background-color: #f7f7f7;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>

    </head>
    <body>
        <nav>
            <a href="/index.html">進貨登錄</a>
            <a href="/purchase-search.html">進貨查詢</a>
            <a href="/product.html">商品管理</a>
            <a href="/supplier.html">廠商管理</a>
        </nav>
        <h1>商品管理</h1>
        <div class="create-product">
            <h3>新增商品</h3>
            <div class="form-row">
                <label for="barcode">條碼</label>
                <input type="text" id="barcode">
            </div>
            <div class="form-row">
                <label for="name">商品名稱</label>
                <input type="text" id="name">
            </div>
            <button id="createButton">新增</button>
        </div>
        <div id="productList">
            <h3>商品列表</h3>
        </div>

        <script>
            function loadProducts() {
                fetch("/products")
                .then(response => response.json())
                .then(products => {
                    const productList = document.getElementById("productList");
                    productList.innerHTML = "<h3>商品列表</h3>";

                    products.forEach(product => {
                        productList.innerHTML += `
                            <div class="product">
                                <p>
                                    ID：${product.id}<br>
                                    條碼：${product.barcode ?? ""}<br>
                                    商品名稱：${product.name}
                                </p>
                            </div>
                    `});
                })
            }
           loadProducts();

           document.getElementById("createButton").addEventListener("click", function() {
                const barcode = document.getElementById("barcode").value;
                const name = document.getElementById("name").value;
                const request = {
                    barcode: barcode || null,
                    name: name
                };
                fetch("/products", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(request)
                })
                .then(response => {
                    if(!response.ok) {
                        throw new Error("新增商品失敗");
                    }
                    return response.json();
                })
                .then(() => {
                    document.getElementById("barcode").value = "";
                    document.getElementById("name").value = "";

                    loadProducts();
                })
                .catch(error => {
                    alert("新增商品失敗");
                    console.error(error);
                })

            })
        </script>
        

    </body>
</html>
