<!DOCTYPE HTML>
<html lang="zh-Hant-TW">
    <head>
        <meta charset="UTF-8">
        <title>商品管理</title>

        <link rel="stylesheet" href="/css/common.css">
        <link rel="stylesheet" href="/css/product.css">
        <link rel="stylesheet" href="/css/commonSp.css">

    </head>
    
    <body>
        <div id="navbar"></div>

        <main>
            <section class="input-panel">
                <h1>商品管理</h1>
                <div class="section">
                    <h2>新增商品</h2>
                    <div class="form-row">
                        <label for="barcode">條碼</label>
                        <input type="text" id="barcode">
                    </div>
                    <div class="form-row">
                        <label for="name">商品名稱</label>
                        <input type="text" id="name">
                    </div>
                <button id="createButton" class="align-right" onclick="createButton()">新增</button>
                </div>
            </section>
            
            <section class="result-panel">
                <div class="section">
                    <div id="productList">
                        <h2>商品列表</h2>
                    </div>
                </div>
            </section>
        </main>

        <script src="/js/common.js"></script>
        <script src="/js/product.js"></script>
    </body>
</html>
